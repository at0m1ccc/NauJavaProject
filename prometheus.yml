global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'library-service'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']